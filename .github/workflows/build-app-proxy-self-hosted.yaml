name: Build patched fluxer-app-proxy-self-hosted
on:
  push:
    branches: [self-hosted-patches]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: fluxer_app_proxy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fluxer-app-proxy-self-hosted:patched
          build-args: |
            FLUXER_APP_PROXY_TIME_FREEZE_ENABLED=false
